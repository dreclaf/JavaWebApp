<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista użytkowników</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container py-5">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Lista użytkowników</h2>
            <a class="btn btn-success" th:href="@{/users/new}">
                <i class="bi bi-plus-circle"></i> Dodaj użytkownika
            </a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Imię</th>
                        <th>Nazwisko</th>
                        <th>Email</th>
                        <th style="width: 160px;">Akcje</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.imie}"></td>
                        <td th:text="${user.nazwisko}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <a th:href="@{'/users/edit/' + ${user.id}}" class="btn btn-sm btn-outline-warning me-1">
                                <i class="bi bi-pencil-square"></i> Edytuj
                            </a>
                            <a th:href="@{'/users/delete/' + ${user.id}}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Czy na pewno chcesz usunąć tego użytkownika?');">
                                <i class="bi bi-trash"></i> Usuń
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Icons (dostępne przez CDN lub WebJars, tutaj CDN): -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.js"></script>
</body>
</html>
